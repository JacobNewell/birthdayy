<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Happy birthday!</title>
  <style>
    body { 
      font-family: sans-serif; 
      padding: 20px; 
      background: #f5f5f5; 
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
    }
    
    .video-container {
      width: 100%;
      max-width: 600px;
      position: relative;
    }

    video {
      width: 100%;
      border-radius: 8px;
      display: block;
    }

    .start-btn {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      background: #2b8aed;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: background 0.2s, transform 0.1s;
      margin-bottom: 20px;
    }

    .start-btn:hover {
      background: #1a73e8;
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <button id="playBtn" class="start-btn">Переглянути привітання</button>

  <div class="video-container">
    <video id="myVideo" controls playsinline>
      <source src="happybdaytt.mp4" type="video/mp4">
      Ваш браузер не підтримує відтворення відео.
    </video>
  </div>

  <script>
    const btn = document.getElementById('playBtn');
    const video = document.getElementById('myVideo');

    btn.addEventListener('click', () => {
      video.play();
      btn.style.display = 'none'; 
    });
  </script>

</body>
</html>
